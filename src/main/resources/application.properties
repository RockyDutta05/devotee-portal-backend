spring.application.name=backend

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://devotee-career-portal-db-devotee-career-portal.d.aivencloud.com:27300/defaultdb?sslmode=require}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mail Configuration (Environment Variables for security)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# Security
server.error.include-stacktrace=never
app.jwt.secret=${JWT_SECRET:mysecretjwtkey12345678901234567890mysecretjwtkey12345678901234567890}

# Cloudflare R2
app.r2.account-id=${R2_ACCOUNT_ID:}
app.r2.access-key=${R2_ACCESS_KEY_ID:}
app.r2.secret-key=${R2_SECRET_ACCESS_KEY:}
app.r2.bucket-name=${R2_BUCKET_NAME:}
app.r2.endpoint-url=${R2_ENDPOINT:}
