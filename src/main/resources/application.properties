spring.application.name=backend

# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mail Configuration (Environment Variables for security)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# Security
server.error.include-stacktrace=never
JWT_SECRET=mysecretjwtkey12345678901234567890mysecretjwtkey12345678901234567890

# Cloudflare R2
R2_ACCESS_KEY=fake
R2_SECRET_KEY=fake
R2_BUCKET_NAME=fake
R2_ENDPOINT_URL=https://fake.r2.cloudflarestorage.com
